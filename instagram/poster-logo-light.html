<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1015, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1015px;
        height: 1350px;
        overflow: hidden;
        background: #f3f5f7;
      }

      .poster {
        position: relative;
        width: 1015px;
        height: 1350px;
        background:
          radial-gradient(ellipse 90% 70% at 85% 8%, rgba(103, 232, 249, 0.28) 0%, transparent 45%),
          radial-gradient(ellipse 100% 80% at 50% 110%, rgba(8, 145, 178, 0.12) 0%, transparent 55%),
          linear-gradient(180deg, #ffffff 0%, #f3f5f7 45%, #e8eef2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .star {
        position: absolute;
        border-radius: 50%;
        background: #0891b2;
        transform: translate(-50%, -50%);
      }

      .star.cyan {
        background: #0891b2;
        box-shadow: 0 0 6px rgba(8, 145, 178, 0.75);
      }

      .star.bright {
        box-shadow:
          0 0 5px rgba(103, 232, 249, 0.95),
          0 0 12px rgba(8, 145, 178, 0.55);
      }

      .star.bright::before,
      .star.bright::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        background: rgba(103, 232, 249, 0.85);
        transform: translate(-50%, -50%);
      }

      .star.bright::before {
        width: 220%;
        height: 1px;
      }

      .star.bright::after {
        width: 1px;
        height: 220%;
      }

      .brand {
        position: relative;
        z-index: 1;
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 140px;
        letter-spacing: -0.05em;
        line-height: 1;
        background: linear-gradient(
          135deg,
          #22d3ee 0%,
          #0891b2 40%,
          #0a0a0b 90%,
          #0a0a0b 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .url {
        position: absolute;
        z-index: 1;
        left: 0;
        right: 0;
        bottom: 96px;
        text-align: center;
        font-family: "Syne", sans-serif;
        font-weight: 600;
        font-size: 32px;
        letter-spacing: -0.03em;
        color: #0891b2;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="stars" id="stars"></div>
      <div class="brand">Zyntaks</div>
      <div class="url">zyntaks.lk</div>
    </div>
    <script>
      (function () {
        const root = document.getElementById("stars");
        function rnd(seed) {
          const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        }
        for (let i = 0; i < 120; i++) {
          const el = document.createElement("span");
          const bright = rnd(i + 50) > 0.9;
          const cyan = rnd(i + 80) > 0.7;
          el.className =
            "star" + (bright ? " bright" : "") + (cyan ? " cyan" : "");
          const size = bright
            ? 2 + rnd(i + 2) * 1.8
            : 0.7 + rnd(i + 2) * 1.6;
          el.style.left = rnd(i) * 100 + "%";
          el.style.top = rnd(i + 1) * 100 + "%";
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.opacity = String(0.2 + rnd(i + 3) * 0.55);
          root.appendChild(el);
        }
      })();
    </script>
  </body>
</html>
